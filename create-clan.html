<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Clan | CinderSMP</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

  <a class="logo" href="index.html">
    🔥 Cinder<span>SMP</span>
  </a>

  <nav>
    <a href="index.html">Home</a>
    <a href="clans.html">Clans</a>
    <a href="tournaments.html">Tournaments</a>
    <a href="activity.html">Activity</a>
  </nav>

</header>

<main class="page">

  <section class="page-header">
    <span class="eyebrow">CINDERSMP</span>
    <h1>Create Your Clan</h1>
    <p>Build your team. Choose your name. Rule your territory.</p>
  </section>

  <section class="form-section">

    <form id="createClanForm">

      <div class="form-group">

        <label>Clan Name</label>

        <input
          id="clanName"
          type="text"
          maxlength="30"
          placeholder="Example: Night Raiders"
          required
        >

      </div>

      <div class="form-group">

        <label>Clan Tag</label>

        <input
          id="clanTag"
          type="text"
          maxlength="5"
          placeholder="NR"
          required
        >

      </div>

      <div class="form-group">

        <label>Clan Description</label>

        <textarea
          id="description"
          maxlength="200"
          placeholder="Tell everyone what your clan is about..."
        ></textarea>

      </div>

      <div class="form-group">

        <label>Your Minecraft Username</label>

        <input
          id="leader"
          type="text"
          maxlength="16"
          placeholder="Your Minecraft username"
          required
        >

      </div>

      <button class="primary-btn" type="submit">
        🔥 Create Clan
      </button>

      <p id="formMessage" class="form-message"></p>

    </form>

  </section>

</main>

<script src="supabase.js"></script>
<script src="script.js"></script>

</body>
