<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Register | CinderSMP</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<header class="navbar">

  <a class="logo" href="index.html">
    🔥 Cinder<span>SMP</span>
  </a>

  <nav>

    <a href="index.html">
      Home
    </a>

    <a href="clans.html">
      Clans
    </a>

  </nav>

</header>


<main class="auth-page">

  <section class="auth-card">

    <div class="auth-icon">
      🔥
    </div>

    <span class="eyebrow">
      CINDERSMP
    </span>

    <h1>
      Create Account
    </h1>

    <p>
      Join the clan network.
    </p>


    <form id="registerForm">

      <label>
        Username
      </label>

      <input
        id="username"
        type="text"
        maxlength="16"
        placeholder="Minecraft username"
        required
      >


      <label>
        Email
      </label>

      <input
        id="email"
        type="email"
        placeholder="you@example.com"
        required
      >


      <label>
        Password
      </label>

      <input
        id="password"
        type="password"
        minlength="6"
        placeholder="At least 6 characters"
        required
      >


      <button
        class="primary-btn"
        type="submit"
      >
        🔥 Create Account
      </button>


      <p
        id="formMessage"
        class="form-message"
      ></p>

    </form>


    <p class="auth-switch">

      Already have an account?

      <a href="login.html">
        Login
      </a>

    </p>

  </section>

</main>


<script
  type="module"
  src="script.js"
></script>

</body>
</html>
